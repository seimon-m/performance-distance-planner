<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Static head tags: SSR is disabled, so anything in svelte:head is
		     invisible to crawlers and link previews — it must live here. -->
		<title>Performance Distance Planner</title>
		<meta name="description" content="Upload a GPX or KML route from Google Earth and get daily stages with distance, ascent, descent and performance kilometers (Leistungskilometer) — including CSV export, stage chart and 3D route map." />
		<meta property="og:title" content="Performance Distance Planner" />
		<meta property="og:description" content="Upload a GPX or KML route from Google Earth and get daily stages with distance, ascent, descent and performance kilometers (Leistungskilometer) — including CSV export, stage chart and 3D route map." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://performance-distance-planner.vercel.app/" />
		<meta name="twitter:card" content="summary" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
